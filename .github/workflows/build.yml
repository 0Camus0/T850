name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git T850/Librerias/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: T850/Librerias/vcpkg/installed
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics

      - name: Install vcpkg packages (x86)
        if: matrix.platform == 'x86'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install glew:x86-windows-static angle:x86-windows vulkan-headers:x86-windows-static vulkan-loader:x86-windows-static vulkan-memory-allocator:x86-windows-static glslang:x86-windows-static

      - name: Install vcpkg packages (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install glew:x64-windows-static angle:x64-windows vulkan-headers:x64-windows-static vulkan-loader:x64-windows-static vulkan-memory-allocator:x64-windows-static glslang:x64-windows-static "imgui[docking-experimental,dx11-binding,dx12-binding,opengl3-binding,sdl3-binding,win32-binding]:x64-windows-static" imguizmo:x64-windows-static

      - name: Install vcpkg packages (ARM64)
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install glew:arm64-windows-static angle:arm64-windows vulkan-headers:arm64-windows-static vulkan-loader:arm64-windows-static vulkan-memory-allocator:arm64-windows-static glslang:arm64-windows-static

      - name: Build
        shell: pwsh
        run: |
          if ("${{ matrix.platform }}" -eq "x64") {
            msbuild T850/T850.sln `
              /t:Build `
              /p:Configuration=${{ matrix.configuration }} `
              /p:Platform=${{ matrix.platform }} `
              /m /nologo /v:minimal
          } else {
            # T8ditor only targets x64; build Framework + DayScene for other platforms
            msbuild T850/T850.sln `
              /t:Framework`;DayScene `
              /p:Configuration=${{ matrix.configuration }} `
              /p:Platform=${{ matrix.platform }} `
              /m /nologo /v:minimal
          }

      - name: Set arch name
        id: arch
        shell: pwsh
        run: |
          $map = @{ "x86" = "x86"; "x64" = "x64"; "ARM64" = "arm64" }
          $arch = $map["${{ matrix.platform }}"]
          echo "name=$arch" >> $env:GITHUB_OUTPUT

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          Write-Host "Build succeeded: $exe"
          $editor = "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/T8ditor.exe"
          if (Test-Path $editor) { Write-Host "Editor built: $editor" }

      - name: Upload build artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: T850-${{ steps.arch.outputs.name }}-${{ matrix.configuration }}
          path: |
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/*.dll

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build launcher
        shell: pwsh
        run: |
          if (-not (Get-Module ps2exe -ListAvailable)) {
            Install-Module ps2exe -Scope CurrentUser -Force
          }
          & T850/scripts/build_launcher_release.ps1

      - name: Package releases
        shell: pwsh
        run: |
          $assets = "T850/Assets"
          foreach ($dir in Get-ChildItem -Path artifacts -Directory) {
            $name = $dir.Name
            $staging = "staging/$name"
            New-Item -ItemType Directory -Path $staging -Force | Out-Null

            # Copy executable and DLLs
            Copy-Item "$($dir.FullName)/*" -Destination $staging -Recurse

            # Copy launcher
            Copy-Item "T850/T850Launcher.exe" -Destination $staging

            # Copy assets
            Copy-Item "$assets/Shaders"    -Destination "$staging/Shaders"    -Recurse
            Copy-Item "$assets/Models"     -Destination "$staging/Models"     -Recurse
            Copy-Item "$assets/Fonts"      -Destination "$staging/Fonts"      -Recurse
            Copy-Item "$assets/Textures"   -Destination "$staging/Textures"   -Recurse
            Copy-Item "$assets/Techniques" -Destination "$staging/Techniques" -Recurse
            Copy-Item "$assets/Scenes"     -Destination "$staging/Scenes"     -Recurse
            Copy-Item "$assets/Layouts"    -Destination "$staging/Layouts"    -Recurse

            # Create zip
            Compress-Archive -Path "$staging/*" -DestinationPath "$name.zip"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
