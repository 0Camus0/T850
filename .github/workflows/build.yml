name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64, ARM64]
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git T850/Librerias/vcpkg

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: T850/Librerias/vcpkg/installed
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics

      - name: Install vcpkg packages (Win32)
        if: matrix.platform == 'Win32'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install --recurse --overlay-ports=../../ports glew:x86-windows-static angle:x86-windows draco:x86-windows draco:x86-windows-static vulkan-headers:x86-windows-static vulkan-loader:x86-windows-static vulkan-memory-allocator:x86-windows-static glslang:x86-windows-static joltphysics:x86-windows-static recastnavigation:x86-windows-static "imgui[docking-experimental,dx11-binding,vulkan-binding,opengl3-binding,sdl3-binding,win32-binding]:x86-windows-static"

      - name: Install vcpkg packages (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install --recurse --overlay-ports=../../ports glew:x64-windows-static angle:x64-windows draco:x64-windows draco:x64-windows-static vulkan-headers:x64-windows-static vulkan-loader:x64-windows-static vulkan-memory-allocator:x64-windows-static glslang:x64-windows-static joltphysics:x64-windows-static recastnavigation:x64-windows-static "imgui[docking-experimental,dx11-binding,dx12-binding,vulkan-binding,opengl3-binding,sdl3-binding,win32-binding]:x64-windows-static" imguizmo:x64-windows-static

      - name: Install vcpkg packages (ARM64)
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install --recurse --overlay-ports=../../ports glew:arm64-windows-static angle:arm64-windows draco:arm64-windows draco:arm64-windows-static vulkan-headers:arm64-windows-static vulkan-loader:arm64-windows-static vulkan-memory-allocator:arm64-windows-static glslang:arm64-windows-static joltphysics:arm64-windows-static recastnavigation:arm64-windows-static "imgui[docking-experimental,dx11-binding,dx12-binding,vulkan-binding,opengl3-binding,sdl3-binding,win32-binding]:arm64-windows-static"

      - name: Build
        shell: pwsh
        run: |
          if ("${{ matrix.platform }}" -eq "x64") {
            msbuild T850/T850.sln `
              /t:Build `
              /p:Configuration=${{ matrix.configuration }} `
              /p:Platform=${{ matrix.platform }} `
              /m /nologo /v:minimal
          } else {
            # T8ditor only targets x64; build Framework + DayScene for other platforms
            msbuild T850/T850.sln `
              /t:Framework`;DayScene `
              /p:Configuration=${{ matrix.configuration }} `
              /p:Platform=${{ matrix.platform }} `
              /m /nologo /v:minimal
          }

      - name: Set arch name
        id: arch
        shell: pwsh
        run: |
          $map = @{ "Win32" = "Win32"; "x64" = "x64"; "ARM64" = "ARM64" }
          $arch = $map["${{ matrix.platform }}"]
          echo "name=$arch" >> $env:GITHUB_OUTPUT

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          Write-Host "Build succeeded: $exe"
          $editor = "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/T8ditor.exe"
          if (Test-Path $editor) { Write-Host "Editor built: $editor" }

      - name: Upload build artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: T850-${{ steps.arch.outputs.name }}-${{ matrix.configuration }}
          path: |
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/T8ditor.exe
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/*.dll

  android:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact_suffix: arm64-v8a
            vcpkg_triplet: arm64-android
          - abi: x86_64
            artifact_suffix: x86_64
            vcpkg_triplet: x64-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git T850/Librerias/vcpkg

      - name: Cache Android vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            T850/Librerias/vcpkg/installed
            T850/Librerias/vcpkg/downloads
          key: android-vcpkg-${{ matrix.vcpkg_triplet }}-${{ hashFiles('SetupAndroidToolchain.bat', 'T850/cmake/AndroidBuild.cmake', 'T850/android/app/build.gradle') }}
          restore-keys: |
            android-vcpkg-${{ matrix.vcpkg_triplet }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\AndroidSdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('SetupAndroidToolchain.bat') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vulkanRoot = 'C:\VulkanSDK'
          $sdk = $null
          if (Test-Path $vulkanRoot) {
            $sdk = Get-ChildItem $vulkanRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $sdk) {
            winget install --id KhronosGroup.VulkanSDK -e --accept-package-agreements --accept-source-agreements --disable-interactivity
            if (Test-Path $vulkanRoot) {
              $sdk = Get-ChildItem $vulkanRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
            }
          }
          if (-not $sdk) {
            throw 'Vulkan SDK install did not produce a C:\VulkanSDK directory.'
          }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Setup Android toolchain
        shell: cmd
        run: SetupAndroidToolchain.bat --sdk "%RUNNER_TEMP%\AndroidSdk" --skip-winget --android-abis ${{ matrix.abi }}

      - name: Build Android Release APK
        shell: cmd
        run: Scripts\Bat\BuildAndroid.bat Release --allow-unsigned-release --sdk "%RUNNER_TEMP%\AndroidSdk" --abi ${{ matrix.abi }}

      - name: Stage Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $abi = '${{ matrix.artifact_suffix }}'
          $apkRoot = 'T850\android\app\build\outputs\apk'
          $apkSource = Join-Path $apkRoot 'production\release\app-production-release-unsigned.apk'
          if (-not (Test-Path $apkSource)) {
            $signedByGradle = $apkSource -replace '-unsigned\.apk$', '.apk'
            if (Test-Path $signedByGradle) {
              $apkSource = $signedByGradle
            } else {
              throw "Build output not found: $apkSource"
            }
          }

          $stage = 'artifacts\android'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            $isReleaseTag = '${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true'
            if ($isReleaseTag) {
              throw 'ANDROID_KEYSTORE_BASE64 is required for tagged releases. Configure Android signing secrets before publishing a release tag.'
            }
            Write-Host 'ANDROID_KEYSTORE_BASE64 was not provided; uploading unsigned Android CI APK.'
            Copy-Item $apkSource -Destination (Join-Path $stage "T850-Android-$abi-unsigned.apk") -Force
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) {
            throw 'ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is provided.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) {
            throw 'ANDROID_KEY_ALIAS is required when ANDROID_KEYSTORE_BASE64 is provided.'
          }

          $sdk = Join-Path $env:RUNNER_TEMP 'AndroidSdk'
          $buildTools = Get-ChildItem (Join-Path $sdk 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $buildTools) {
            throw "Android build-tools were not found under $sdk."
          }
          $zipalign = Join-Path $buildTools.FullName 'zipalign.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $keystore = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

          $keyPassword = $env:ANDROID_KEY_PASSWORD
          if ([string]::IsNullOrWhiteSpace($keyPassword)) {
            $keyPassword = $env:ANDROID_KEYSTORE_PASSWORD
          }
          $aligned = Join-Path $env:RUNNER_TEMP "T850-Android-$abi-aligned.apk"
          $signed = Join-Path $stage "T850-Android-$abi.apk"
          & $zipalign -p -f 4 $apkSource $aligned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $apksigner sign --ks $keystore --ks-pass "pass:$env:ANDROID_KEYSTORE_PASSWORD" --ks-key-alias $env:ANDROID_KEY_ALIAS --key-pass "pass:$keyPassword" --out $signed $aligned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $apksigner verify --verbose $signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: T850-Android-${{ matrix.artifact_suffix }}-Release
          path: artifacts/android/*.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build launcher
        shell: pwsh
        run: |
          if (-not (Get-Module ps2exe -ListAvailable)) {
            Install-Module ps2exe -Scope CurrentUser -Force
          }
          & T850/scripts/build_launcher_release.ps1

      - name: Package releases
        shell: pwsh
        run: |
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $assets = "T850/Assets"
          foreach ($dir in Get-ChildItem -Path artifacts -Directory | Where-Object { $_.Name -notlike "T850-Android-*" }) {
            $name = $dir.Name
            $staging = "staging/$name"
            New-Item -ItemType Directory -Path $staging -Force | Out-Null

            # Copy executable and DLLs
            Copy-Item "$($dir.FullName)/*" -Destination $staging -Recurse

            # Copy launcher
            Copy-Item "T850/T850Launcher.exe" -Destination $staging

            # Copy lightweight tracked assets. Heavy model/texture payloads are
            # downloaded by the launcher from the cloud manifests.
            foreach ($assetDir in @("Shaders", "Models", "Fonts", "Textures", "Scenes", "Layouts")) {
              $source = "$assets/$assetDir"
              if (Test-Path $source) {
                Copy-Item $source -Destination "$staging/$assetDir" -Recurse
              }
            }

            # Copy cloud asset downloader support used by T850Launcher.exe.
            New-Item -ItemType Directory -Path "$staging/scripts" -Force | Out-Null
            Copy-Item "T850/scripts/ModelCloud.ps1" -Destination "$staging/scripts/ModelCloud.ps1" -Force
            if (Test-Path "$assets/model-cloud-manifest.json") {
              Copy-Item "$assets/model-cloud-manifest.json" -Destination "$staging/model-cloud-manifest.json" -Force
            }

            # Copy config
            if (Test-Path "T850/config.json") {
              Copy-Item "T850/config.json" -Destination $staging
            }

            # Create zip
            Compress-Archive -Path "$staging/*" -DestinationPath "$releaseDir/$name.zip"
          }

          foreach ($apk in Get-ChildItem -Path artifacts -Recurse -Filter "*.apk") {
            Copy-Item $apk.FullName -Destination (Join-Path $releaseDir $apk.Name) -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release-assets/*"
          generate_release_notes: true
