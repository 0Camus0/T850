name: Build

on:
  push:
    branches: [ master, microsoft_webgpu_branch ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, microsoft_webgpu_branch ]

jobs:
  validate-build-registration:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate MSBuild and CMake source registration
        shell: pwsh
        run: |
          & T850/scripts/ValidateBuildRegistration.ps1

      - name: Validate WebGPU launcher routing and WPF state
        shell: powershell
        run: |
          & T850/scripts/TestLauncherWebGPU.ps1 -Ui

      - name: Validate Minecraft terrain atlas mappings
        shell: pwsh
        run: |
          python T850/scripts/verify_minecraft_atlas.py

  build:
    needs: validate-build-registration
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64, ARM64]
        configuration: [Debug, Release]
        include:
          - platform: Win32
            runner: windows-2022
            msbuild_architecture: x64
          - platform: x64
            runner: windows-2022
            msbuild_architecture: x64
          - platform: ARM64
            runner: windows-11-arm
            msbuild_architecture: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.msbuild_architecture }}

      - name: Pin vcpkg compiler to Visual Studio 2022
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = if ('${{ matrix.platform }}' -eq 'ARM64') {
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }
          $vs2022 = & $vswhere -latest -products * -version "[17.0,18.0)" `
            -requires $component `
            -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs2022)) {
            throw 'Visual Studio 2022 C++ tools were not found.'
          }
          "VCPKG_VISUAL_STUDIO_PATH=$vs2022" >> $env:GITHUB_ENV
          Write-Host "vcpkg compiler: $vs2022"

      - name: Clone vcpkg
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -in @('x64', 'ARM64')) {
            & T850/scripts/SetupDawn.ps1 -Mode Bootstrap -Architecture '${{ matrix.platform }}'
          } else {
            git clone https://github.com/microsoft/vcpkg.git T850/Librerias/vcpkg
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed.' }
            $revision = git rev-parse HEAD:T850/Librerias/vcpkg
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read the recorded vcpkg revision.' }
            git -C T850/Librerias/vcpkg checkout --detach $revision
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check out the recorded vcpkg revision.' }
          }

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: T850/Librerias/vcpkg/installed
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('.github/workflows/build.yml', 'T850/cmake/vcpkg-overlays/**', 'T850/scripts/SetupDawn.ps1') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }

      - name: Install vcpkg packages (Win32)
        if: matrix.platform == 'Win32'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install --recurse glew:x86-windows-static angle:x86-windows draco:x86-windows draco:x86-windows-static vulkan-headers:x86-windows-static vulkan-loader:x86-windows-static vulkan-memory-allocator:x86-windows-static glslang:x86-windows-static joltphysics:x86-windows-static recastnavigation:x86-windows-static "imgui[docking-experimental,dx11-binding,vulkan-binding,opengl3-binding,sdl3-binding,win32-binding]:x86-windows-static" imguizmo:x86-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'Win32 dependency installation failed.' }

      - name: Install vcpkg packages (x64)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install --recurse glew:x64-windows-static angle:x64-windows draco:x64-windows draco:x64-windows-static vulkan-headers:x64-windows-static vulkan-loader:x64-windows-static vulkan-memory-allocator:x64-windows-static glslang:x64-windows-static joltphysics:x64-windows-static recastnavigation:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'Base dependency installation failed.' }
          & ../../scripts/SetupDawn.ps1

      - name: Install vcpkg packages (ARM64)
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          cd T850/Librerias/vcpkg
          ./vcpkg.exe install --recurse glew:arm64-windows-static angle:arm64-windows draco:arm64-windows draco:arm64-windows-static vulkan-headers:arm64-windows-static vulkan-loader:arm64-windows-static vulkan-memory-allocator:arm64-windows-static glslang:arm64-windows-static joltphysics:arm64-windows-static recastnavigation:arm64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 dependency installation failed.' }
          & ../../scripts/SetupDawn.ps1 -Architecture ARM64

      - name: Build Dawn package probe (hardware run is local)
        if: matrix.platform == 'x64' || matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.platform }}' -eq 'ARM64') { '-arm64' } else { '' }
          $buildRoot = "T850/build/dawn-package$suffix"
          cmake --build $buildRoot --config ${{ matrix.configuration }} --target DawnPackageProbe DawnMSBuildProbe DawnShaderProbe ShaderPreprocessorProbe DawnSurfaceProbe --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Dawn package probe build failed.' }
          ctest --test-dir $buildRoot -C ${{ matrix.configuration }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'In-process shader translation/cache tests failed.' }

      - name: Build
        shell: pwsh
        env:
          PreferredToolArchitecture: ${{ matrix.msbuild_architecture }}
        run: |
          & T850/scripts/build.ps1 `
            -Config ${{ matrix.configuration }} `
            -Platform ${{ matrix.platform }} `
            -Action Build

      - name: Set arch name
        id: arch
        shell: pwsh
        run: |
          $map = @{ "Win32" = "Win32"; "x64" = "x64"; "ARM64" = "ARM64" }
          $arch = $map["${{ matrix.platform }}"]
          echo "name=$arch" >> $env:GITHUB_OUTPUT

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          Write-Host "Build succeeded: $exe"
          $editor = "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/T8ditor.exe"
          if (-not (Test-Path $editor)) { throw "Editor output not found: $editor" }
          Write-Host "Editor built: $editor"
          foreach ($runtimeFile in @('vulkan-1.dll', 'licenses/vulkan-loader.txt')) {
            $path = Join-Path (Split-Path $exe) $runtimeFile
            if (-not (Test-Path $path)) { throw "Required Vulkan runtime file not staged: $path" }
          }

      - name: Run gameplay and terrain self-tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path "T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe").Path
          $stdout = Join-Path $env:RUNNER_TEMP 'game-selftest-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'game-selftest-stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList '--game-selftest' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Get-Content $stdout
            Get-Content $stderr
            $exitCode = $process.ExitCode
            Write-Host ('Self-test exit code: {0} (0x{0:X8})' -f $exitCode)
            if ($exitCode -ne 0) { throw "Gameplay/terrain self-tests failed with exit code $exitCode." }
            if (-not (Select-String -Path $stdout -Pattern '^PASS ' -Quiet)) { throw 'Self-tests exited without reporting any passing checks.' }
          } finally {
            $process.Dispose()
          }

      - name: Cache Emscripten SDK
        if: matrix.platform == 'x64' && matrix.configuration == 'Release'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\emsdk
          key: emsdk-${{ runner.os }}-6.0.9-${{ hashFiles('T850/scripts/BuildWeb.ps1') }}
          restore-keys: |
            emsdk-${{ runner.os }}-6.0.9-

      - name: Build architecture-neutral WebAssembly bundle
        if: matrix.platform == 'x64' && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          & T850/scripts/BuildWeb.ps1 -EmSdkRoot (Join-Path $env:RUNNER_TEMP 'emsdk') -Configuration Release -AssetMode Cloud -Clean

      - name: Upload WebAssembly bundle
        if: matrix.platform == 'x64' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: T850-Web-Release
          path: |
            T850/build/web/site
            T850/build/web/WebShaders
            T850/build/web/CloudAssets
          if-no-files-found: error

      - name: Upload build artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: T850-${{ steps.arch.outputs.name }}-${{ matrix.configuration }}
          path: |
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/DayScene.exe
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/T8ditor.exe
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/*.dll
            T850/bin/${{ steps.arch.outputs.name }}/${{ matrix.configuration }}/licenses/*.txt

  browser-webgpu:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
            edge_machine: '0x8664'
          - architecture: ARM64
            runner: windows-11-arm
            edge_machine: '0xAA64'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: T850/web/package-lock.json

      - name: Install browser test dependencies
        shell: pwsh
        run: npm ci --prefix T850/web

      - name: Download architecture-neutral WebAssembly bundle
        uses: actions/download-artifact@v4
        with:
          name: T850-Web-Release
          path: T850/build/web

      - name: Verify WebAssembly bundle layout
        shell: pwsh
        run: |
          foreach ($path in @(
            'T850/build/web/site/DayScene.html',
            'T850/build/web/site/DayScene.js',
            'T850/build/web/site/DayScene.wasm',
            'T850/build/web/site/scenes.json',
            'T850/build/web/CloudAssets/routes.json'
          )) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Downloaded browser artifact is missing: $path" }
          }
          if (-not (Get-ChildItem 'T850/build/web/WebShaders' -File -Filter '*.json' | Select-Object -First 1)) {
            throw 'Downloaded browser artifact contains no prepared shader packages.'
          }
          $payloads = @(Get-ChildItem 'T850/build/web/site', 'T850/build/web/WebShaders', 'T850/build/web/CloudAssets' -Recurse -File |
            Where-Object Extension -In @('.glb', '.gltf', '.bin', '.dds', '.png', '.jpg', '.jpeg', '.t8ibl', '.zip'))
          if ($payloads.Count) {
            throw "Cloud browser artifact unexpectedly contains asset payloads: $($payloads.FullName -join ', ')"
          }

      - name: Verify native Edge architecture
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
          $edge = $null
          foreach ($candidate in $candidates) {
            $stream = [IO.File]::OpenRead($candidate)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              $stream.Position = 0x3c
              $stream.Position = $reader.ReadInt32() + 4
              $machine = ('0x{0:X4}' -f $reader.ReadUInt16())
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
            Write-Host "Edge candidate: $candidate ($machine)"
            if ($machine -eq '${{ matrix.edge_machine }}') {
              $edge = $candidate
              break
            }
          }
          if (-not $edge) {
            throw 'No native ${{ matrix.architecture }} Edge executable was found.'
          }
          "T850_EDGE_PATH=$edge" >> $env:GITHUB_ENV
          Write-Host "Native ${{ matrix.architecture }} Edge: $edge (${{ matrix.edge_machine }})"

      - name: Run WebGPU compute self-test in native Edge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 't850-web-server.log'
          $stderr = Join-Path $env:RUNNER_TEMP 't850-web-server-error.log'
          $server = Start-Process node -ArgumentList 'T850/web/server.mjs', '--port', '8765' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $server.Handle
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; ++$attempt) {
              if ($server.HasExited) {
                throw "Browser bundle server exited with code $($server.ExitCode)."
              }
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:8765/__t850' -TimeoutSec 2
                if ($response.identity) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw 'Browser bundle server did not become ready.' }
            & node T850/web/test-firefox.mjs --browser edge --binary "$env:T850_EDGE_PATH" --headless --software-webgpu --compute-selftest --no-interactions --url 'http://127.0.0.1:8765/?scene=6&width=960&height=540' --output "T850/build/web/ci-${{ matrix.architecture }}-edge"
            if ($LASTEXITCODE -ne 0) { throw "Edge WebGPU test failed with exit code $LASTEXITCODE." }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
            $server.Dispose()
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
          }

      - name: Upload browser WebGPU report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T850-Web-${{ matrix.architecture }}-Edge-Report
          path: T850/build/web/ci-${{ matrix.architecture }}-edge
          if-no-files-found: warn

  android:
    needs: validate-build-registration
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            artifact_suffix: arm64-v8a
            vcpkg_triplet: arm64-android
          - abi: x86_64
            artifact_suffix: x86_64
            vcpkg_triplet: x64-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git T850/Librerias/vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed.' }
          $revision = git rev-parse HEAD:T850/Librerias/vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the recorded vcpkg revision.' }
          git -C T850/Librerias/vcpkg checkout --detach $revision
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check out the recorded vcpkg revision.' }

      - name: Cache Android vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            T850/Librerias/vcpkg/installed
            T850/Librerias/vcpkg/downloads
          key: android-vcpkg-${{ matrix.vcpkg_triplet }}-${{ hashFiles('SetupAndroidToolchain.bat', 'T850/cmake/AndroidBuild.cmake', 'T850/android/app/build.gradle') }}
          restore-keys: |
            android-vcpkg-${{ matrix.vcpkg_triplet }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\AndroidSdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('SetupAndroidToolchain.bat') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vulkanRoot = 'C:\VulkanSDK'
          $sdk = $null
          if (Test-Path $vulkanRoot) {
            $sdk = Get-ChildItem $vulkanRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          }
          if (-not $sdk) {
            winget install --id KhronosGroup.VulkanSDK -e --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
            if (Test-Path $vulkanRoot) {
              $sdk = Get-ChildItem $vulkanRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
            }
          }
          if (-not $sdk) {
            throw 'Vulkan SDK install did not produce a C:\VulkanSDK directory.'
          }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Setup Android toolchain
        shell: cmd
        run: SetupAndroidToolchain.bat --sdk "%RUNNER_TEMP%\AndroidSdk" --skip-winget --android-abis ${{ matrix.abi }}

      - name: Build Android Release APK
        shell: cmd
        run: T850\scripts\android\BuildAndroid.bat Release --allow-unsigned-release --sdk "%RUNNER_TEMP%\AndroidSdk" --abi ${{ matrix.abi }}

      - name: Stage Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $abi = '${{ matrix.artifact_suffix }}'
          $apkRoot = 'T850\android\app\build\outputs\apk'
          $apkSource = Join-Path $apkRoot 'production\release\app-production-release-unsigned.apk'
          if (-not (Test-Path $apkSource)) {
            $signedByGradle = $apkSource -replace '-unsigned\.apk$', '.apk'
            if (Test-Path $signedByGradle) {
              $apkSource = $signedByGradle
            } else {
              throw "Build output not found: $apkSource"
            }
          }

          $stage = 'artifacts\android'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            $isReleaseTag = '${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true'
            if ($isReleaseTag) {
              throw 'ANDROID_KEYSTORE_BASE64 is required for tagged releases. Configure Android signing secrets before publishing a release tag.'
            }
            Write-Host 'ANDROID_KEYSTORE_BASE64 was not provided; uploading unsigned Android CI APK.'
            Copy-Item $apkSource -Destination (Join-Path $stage "T850-Android-$abi-unsigned.apk") -Force
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) {
            throw 'ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is provided.'
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) {
            throw 'ANDROID_KEY_ALIAS is required when ANDROID_KEYSTORE_BASE64 is provided.'
          }

          $sdk = Join-Path $env:RUNNER_TEMP 'AndroidSdk'
          $buildTools = Get-ChildItem (Join-Path $sdk 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $buildTools) {
            throw "Android build-tools were not found under $sdk."
          }
          $zipalign = Join-Path $buildTools.FullName 'zipalign.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $keystore = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

          $keyPassword = $env:ANDROID_KEY_PASSWORD
          if ([string]::IsNullOrWhiteSpace($keyPassword)) {
            $keyPassword = $env:ANDROID_KEYSTORE_PASSWORD
          }
          $aligned = Join-Path $env:RUNNER_TEMP "T850-Android-$abi-aligned.apk"
          $signed = Join-Path $stage "T850-Android-$abi.apk"
          & $zipalign -p -f 4 $apkSource $aligned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $apksigner sign --ks $keystore --ks-pass "pass:$env:ANDROID_KEYSTORE_PASSWORD" --ks-key-alias $env:ANDROID_KEY_ALIAS --key-pass "pass:$keyPassword" --out $signed $aligned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $apksigner verify --verbose $signed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: T850-Android-${{ matrix.artifact_suffix }}-Release
          path: artifacts/android/*.apk

  steamdeck:
    needs: validate-build-registration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git T850/Librerias/vcpkg
          revision=$(git rev-parse HEAD:T850/Librerias/vcpkg)
          git -C T850/Librerias/vcpkg checkout --detach "$revision"

      - name: Cache Steam Deck vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            T850/Librerias/vcpkg/installed
            T850/Librerias/vcpkg/downloads
          key: steamdeck-vcpkg-${{ hashFiles('T850/CMakeLists.txt', 'T850/steamdeck/BuildSteamRuntime.sh', '.github/workflows/build.yml') }}
          restore-keys: |
            steamdeck-vcpkg-

      - name: Validate Steam Deck launcher scripts
        run: |
          chmod +x T850/steamdeck/*.sh
          bash -n T850/steamdeck/BuildSteamRuntime.sh
          bash -n T850/steamdeck/PackageSteamDeckRelease.sh
          bash -n T850/steamdeck/T850.sh
          bash -n T850/steamdeck/T850DeckLauncher.sh
          bash T850/steamdeck/TestSteamDeckScripts.sh
          python3 -m py_compile T850/steamdeck/T850DeckLauncher.py

      - name: Build Steam Deck runtime and editor
        run: |
          T850/steamdeck/BuildSteamRuntime.sh --configuration Release --with-editor

      - name: Verify Steam Deck runtime and editor output
        run: |
          test -x T850/bin/SteamDeck/Release/DayScene
          test -x T850/bin/SteamDeck/Release/T8ditor
          test -f T850/bin/SteamDeck/Release/libc++.so.1
          test -f T850/bin/SteamDeck/Release/libc++abi.so.1
          test -f T850/bin/SteamDeck/Release/libunwind.so.1

      - name: Package Steam Deck release
        run: |
          T850/steamdeck/PackageSteamDeckRelease.sh --configuration Release --with-editor --skip-build --output artifacts/steamdeck/T850-SteamDeck-Release.tar.gz
          tar -tzf artifacts/steamdeck/T850-SteamDeck-Release.tar.gz | grep -Fx 'T850-SteamDeck-Release/bin/SteamDeck/Release/T8ditor'

      - name: Upload Steam Deck package
        uses: actions/upload-artifact@v4
        with:
          name: T850-SteamDeck-Release
          path: artifacts/steamdeck/T850-SteamDeck-Release.tar.gz

  release:
    needs: [build, browser-webgpu, android, steamdeck]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build launcher
        shell: pwsh
        run: |
          if (-not (Get-Module ps2exe -ListAvailable)) {
            Install-Module ps2exe -Scope CurrentUser -Force
          }
          & T850/scripts/build_launcher_release.ps1

      - name: Package releases
        shell: pwsh
        run: |
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $assets = "T850/Assets"
          foreach ($dir in Get-ChildItem -Path artifacts -Directory | Where-Object { $_.Name -notlike "T850-Android-*" -and $_.Name -notlike "T850-Web-*-Edge-Report" -and $_.Name -notin @("T850-Web-Release", "T850-SteamDeck-Release") }) {
            $name = $dir.Name
            $staging = "staging/$name"
            New-Item -ItemType Directory -Path $staging -Force | Out-Null

            # Copy executable and DLLs
            Copy-Item "$($dir.FullName)/*" -Destination $staging -Recurse

            # Copy launcher
            Copy-Item "T850/T850Launcher.exe" -Destination $staging

            # Copy lightweight tracked assets. Heavy model/texture payloads are
            # downloaded by the launcher from the cloud manifests.
            foreach ($assetDir in @("Shaders", "Models", "Fonts", "Textures", "Scenes", "Layouts")) {
              $source = "$assets/$assetDir"
              if (Test-Path $source) {
                Copy-Item $source -Destination "$staging/$assetDir" -Recurse
              }
            }

            # Copy cloud asset downloader support used by T850Launcher.exe.
            New-Item -ItemType Directory -Path "$staging/scripts" -Force | Out-Null
            Copy-Item "T850/scripts/ModelCloud.ps1" -Destination "$staging/scripts/ModelCloud.ps1" -Force
            if (Test-Path "$assets/model-cloud-manifest.json") {
              Copy-Item "$assets/model-cloud-manifest.json" -Destination "$staging/model-cloud-manifest.json" -Force
            }

            # Copy config
            if (Test-Path "T850/config.json") {
              Copy-Item "T850/config.json" -Destination $staging
            }

            # Create zip
            Compress-Archive -Path "$staging/*" -DestinationPath "$releaseDir/$name.zip"
          }

          foreach ($apk in Get-ChildItem -Path artifacts -Recurse -Filter "*.apk") {
            Copy-Item $apk.FullName -Destination (Join-Path $releaseDir $apk.Name) -Force
          }

          foreach ($steamDeckPackage in Get-ChildItem -Path artifacts -Recurse -Filter "T850-SteamDeck-*.tar.gz") {
            Copy-Item $steamDeckPackage.FullName -Destination (Join-Path $releaseDir $steamDeckPackage.Name) -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "release-assets/*"
          generate_release_notes: true
