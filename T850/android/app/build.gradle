plugins { id 'com.android.application' }

def assetSourceDir = file('../../Assets')
def shaderSourceDir = new File(assetSourceDir, 'Shaders')
def shaderPermutationFile = new File(shaderSourceDir, 'shader_permutations.json')
def filteredAssetDir = layout.buildDirectory.dir('generated/t850FilteredAssets').get().asFile
def generatedAssetDir = layout.buildDirectory.dir('generated/t850Assets').get().asFile
def shaderOutputDir = new File(generatedAssetDir, 'Shaders/spirv')
def isWindowsHost = System.getProperty('os.name').toLowerCase().contains('windows')
def shaderCompilerName = isWindowsHost ? 'glslangValidator.exe' : 'glslangValidator'
def t850AndroidAbis = (findProperty('t850AndroidAbis') ?: 'arm64-v8a')
    .toString()
    .split(',')
    .collect { it.trim() }
    .findAll { !it.isEmpty() }
def t850VulkanValidation = (findProperty('t850VulkanValidation') ?: 'false').toString().toBoolean()

def localSigningProperties = new Properties()
[
    file('../signing.properties'),
    file('signing.properties'),
    new File(System.getProperty('user.home'), '.android/t850-release-signing.properties')
].findAll { it.isFile() }.each { propsFile ->
    propsFile.withInputStream { localSigningProperties.load(it) }
}

def signingValue = { String name ->
    def value = findProperty(name)
    if (value == null) value = localSigningProperties.getProperty(name)
    if (value == null) value = System.getenv(name)
    value == null ? null : value.toString()
}

def releaseStoreFile = signingValue('T850_RELEASE_STORE_FILE') ?: signingValue('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = signingValue('T850_RELEASE_STORE_PASSWORD') ?: signingValue('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('T850_RELEASE_KEY_ALIAS') ?: signingValue('ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('T850_RELEASE_KEY_PASSWORD') ?: signingValue('ANDROID_KEY_PASSWORD')
def releaseSigningReady = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('release') }

if (releaseTaskRequested && !releaseSigningReady) {
    throw new GradleException(
        'Release signing is not configured. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ' +
        'ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD as environment variables, Gradle properties, ' +
        'or in ~/.android/t850-release-signing.properties.')
}

if (t850AndroidAbis.isEmpty()) {
    throw new GradleException('At least one Android ABI must be specified in t850AndroidAbis.')
}

def findExecutableOnPath = { String executableName ->
    def pathValue = System.getenv('PATH')
    if (!pathValue) return null
    pathValue.split(java.util.regex.Pattern.quote(File.pathSeparator))
        .collect { new File(it, executableName) }
        .find { it.isFile() }
}

def resolveGlslangValidator = {
    def candidates = []
    def vulkanSdk = System.getenv('VULKAN_SDK')
    if (vulkanSdk) {
        candidates << new File(new File(vulkanSdk, isWindowsHost ? 'Bin' : 'bin'), shaderCompilerName)
    }
    def pathMatch = findExecutableOnPath(shaderCompilerName)
    if (pathMatch) candidates << pathMatch

    def validator = candidates.find { it.isFile() }
    if (validator) return validator.absolutePath

    throw new GradleException(
        'glslangValidator is required for T850 Android offline shader compilation. ' +
        'Run SetupAndroidToolchain.bat without --skip-winget, or install the Vulkan SDK and set VULKAN_SDK/PATH.')
}

def getT850BuildWorkers = {
    def envWorkers = System.getenv('T850_BUILD_WORKERS')
    if (envWorkers) {
        try {
            def parsedWorkers = envWorkers.toInteger()
            if (parsedWorkers > 0) return parsedWorkers
        } catch (ignored) {
        }
    }
    Math.max(1, Runtime.runtime.availableProcessors() - 1)
}

def runShaderCompileCommands = { List shaderCommands, int requestedWorkers ->
    if (shaderCommands.isEmpty()) return

    def workerCount = Math.max(1, Math.min(requestedWorkers, shaderCommands.size()))
    logger.lifecycle("[T850] Compiling ${shaderCommands.size()} Android shader outputs with ${workerCount} workers.")

    def executor = java.util.concurrent.Executors.newFixedThreadPool(workerCount)
    try {
        def futures = shaderCommands.collect { command ->
            executor.submit({ ->
                def processBuilder = new ProcessBuilder(command.args)
                processBuilder.redirectErrorStream(true)
                def process = processBuilder.start()
                def output = process.inputStream.getText('UTF-8')
                def exitCode = process.waitFor()
                [command: command, output: output, exitCode: exitCode]
            } as java.util.concurrent.Callable)
        }

        def failures = []
        futures.each { future ->
            def result = future.get()
            if (result.exitCode != 0) {
                failures << result
            }
        }

        if (!failures.isEmpty()) {
            def message = new StringBuilder()
            message << "${failures.size()} Android shader compile command(s) failed."
            failures.each { failure ->
                message << System.lineSeparator()
                message << "\n[${failure.command.label}] exit ${failure.exitCode}: "
                message << failure.command.args.collect { arg -> arg.contains(' ') ? "\"${arg}\"" : arg }.join(' ')
                if (failure.output?.trim()) {
                    message << System.lineSeparator()
                    message << failure.output.trim()
                }
            }
            throw new GradleException(message.toString())
        }
    } finally {
        executor.shutdownNow()
    }
}

android {
    namespace 'com.t850.engine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.t850.engine'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1-android-vulkan'
        ndk { abiFilters(*t850AndroidAbis) }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-28',
                    '-DT850_ANDROID_NATIVE_ACTIVITY=ON',
                    "-DT850_VULKAN_VALIDATION=${t850VulkanValidation ? 'ON' : 'OFF'}"
                cppFlags '-std=c++23 -fexceptions -frtti'
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake { path '../../CMakeLists.txt' }
    }

    sourceSets {
        main {
            assets.srcDirs = [filteredAssetDir, 'src/main/assets', generatedAssetDir]
        }
    }

    androidResources {
        noCompress += ['bin', 'dds', 'glb', 'gltf', 'hdr', 'ktx', 'ktx2', 'spv', 'tga', 'x']
    }
}


tasks.register('syncT850AndroidAssets', Sync) {
    from(assetSourceDir) {
        exclude 'Models/.t8cache/**'
        exclude 'Shaders/.t8shadercache/**'
        exclude 'Textures/GeneratedIBLCache/**'
        exclude '**/.t8cache/**'
        exclude '**/.t8shadercache/**'
        exclude '**/GeneratedIBLCache/**'
        exclude '**/*.t8ibl'
        exclude '**/*.t8mesh'
        exclude '**/*.dxbc'
    }
    into(filteredAssetDir)
}

tasks.register('compileT850AndroidShaders') {
    inputs.dir(shaderSourceDir)
    outputs.dir(shaderOutputDir)
    doLast {
        def validator = resolveGlslangValidator()
        def shaderCompileCommands = []
        shaderOutputDir.mkdirs()

        def compiledOutputs = [] as Set
        def shaderByName = [:]
        fileTree(shaderSourceDir).matching { include '**/*.hlsl' }.each { shader ->
            shaderByName[shader.name] = shader
            def name = shader.name
            def stage = name.startsWith('VS_') ? 'vert' : (name.startsWith('FS_') ? 'frag' : null)
            def entry = name.startsWith('VS_') ? 'VS' : (name.startsWith('FS_') ? 'FS' : null)
            if (stage == null) return
            def output = new File(shaderOutputDir, name + '.spv')
            compiledOutputs << output.absolutePath
            shaderCompileCommands << [
                label: output.name,
                args: [validator, '-D', '-V', '-S', stage, '-e', entry, shader.absolutePath, '-o', output.absolutePath].collect { it.toString() }
            ]
        }

        if (shaderPermutationFile.isFile()) {
            def json = new groovy.json.JsonSlurper().parse(shaderPermutationFile)
            def permutations = json.permutations ?: [:]
            permutations.each { key, permutation ->
                def normalizedKey = key.toString().replaceFirst('^0[xX]', '').toUpperCase()
                def defines = (permutation.defines ?: []).collect { it.toString() }
                [permutation.vertexShader, permutation.fragmentShader].findAll { it }.each { shaderName ->
                    def shader = shaderByName[shaderName.toString()]
                    if (shader == null) {
                        throw new GradleException("Shader permutation references missing shader '${shaderName}'")
                    }

                    def name = shader.name
                    def stage = name.startsWith('VS_') ? 'vert' : (name.startsWith('FS_') ? 'frag' : null)
                    def entry = name.startsWith('VS_') ? 'VS' : (name.startsWith('FS_') ? 'FS' : null)
                    if (stage == null) return

                    def output = new File(shaderOutputDir, "${name}.${normalizedKey}.spv")
                    if (!compiledOutputs.add(output.absolutePath)) return

                    def args = [validator, '-D', '-V', '-S', stage, '-e', entry]
                    defines.each { args << "-D${it}" }
                    args << shader.absolutePath
                    args << '-o'
                    args << output.absolutePath
                    shaderCompileCommands << [
                        label: output.name,
                        args: args.collect { it.toString() }
                    ]
                }
            }
        } else {
            logger.lifecycle('[T850] No shader_permutations.json found; Android APK will include base SPIR-V only.')
        }

        runShaderCompileCommands(shaderCompileCommands, getT850BuildWorkers())
    }
}

preBuild.dependsOn('syncT850AndroidAssets')
preBuild.dependsOn('compileT850AndroidShaders')
